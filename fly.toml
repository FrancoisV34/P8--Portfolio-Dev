# Nom provisoire : le modifier seulement si Fly.io indique qu'il est déjà pris.
app = "francoisv34-portfolio-cfo"
primary_region = "cdg"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/portfolio.sqlite"
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  PORT = "3000"
  SITE_URL = "https://francoisv34-portfolio-cfo.fly.dev"

# SQLite n'accepte qu'un seul écrivain. Une seule Machine et son unique volume
# sont donc délibérés ; le déploiement peut occasionner une courte interruption.
[deploy]
  strategy = "immediate"

[mounts]
  source = "finance_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 14

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
